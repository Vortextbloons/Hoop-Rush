<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="margin: 0">
    <div class="wrap">
      <style>
        .wrap {
          --background: hsl(222 22% 6%);
          --card: hsl(222 20% 9%);
          --surface1: hsl(222 20% 9%);
          --surface3: hsl(222 16% 16%);
          --border: hsl(222 14% 18%);
          --foreground: hsl(40 20% 94%);
          --muted: hsl(222 10% 68%);
          --dim: hsl(222 10% 46%);
          --primary: hsl(13 100% 62%);
          --font-sans: Inter, system-ui, sans-serif;
          --font-mono: 'Roboto Mono', ui-monospace, monospace;
          --font-display: 'Barlow Condensed', system-ui, sans-serif;
          font-family: var(--font-sans);
          color: var(--foreground);
          display: grid;
          gap: 10px;
          font-size: 13px;
        }
        .wrap p {
          margin: 0;
        }
        .cap {
          font-family: var(--font-mono);
          font-size: 8px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: var(--dim);
        }

        /* exact replica: absolute close + pr-14 */
        .sheet {
          width: 344px;
          border-radius: 12px;
          border: 1px solid var(--border);
          background: var(--card);
          overflow: hidden;
        }
        .hdr {
          position: relative;
          border-bottom: 1px solid var(--border);
          background: var(--surface1);
        }
        .close {
          position: absolute;
          right: 12px;
          top: 12px;
          z-index: 20;
          width: 40px;
          height: 40px;
          border-radius: 99px;
          border: 1px solid var(--border);
          background: color-mix(in oklab, var(--card) 90%, transparent);
          display: grid;
          place-items: center;
          color: var(--muted);
          font-size: 13px;
          box-shadow: 0 2px 8px rgb(0 0 0 / 35%);
        }
        .row {
          position: relative;
          display: flex;
          gap: 12px;
          padding: 12px 56px 12px 16px;
          align-items: flex-start;
        }
        .face {
          width: 64px;
          height: 64px;
          flex: none;
          border-radius: 12px;
          background: linear-gradient(160deg, var(--surface3), #12161f);
          display: grid;
          place-items: center;
          font-family: var(--font-display);
          font-size: 18px;
          font-weight: 800;
          color: var(--muted);
        }
        .nm {
          min-width: 0;
          flex: 1;
        }
        .name {
          font-family: var(--font-display);
          font-size: 20px;
          font-weight: 800;
          line-height: 1.1;
          letter-spacing: -0.01em;
          text-transform: uppercase;
          overflow-wrap: anywhere;
        }
        .meta {
          margin-top: 4px;
          font-family: var(--font-mono);
          font-size: 10px;
          line-height: 1.4;
          color: var(--muted);
          text-transform: uppercase;
        }
        .badges {
          margin-top: 8px;
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
        }
        .badge {
          border-radius: 4px;
          background: var(--surface3);
          padding: 2px 6px;
          font-family: var(--font-mono);
          font-size: 9px;
          font-weight: 600;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          color: var(--muted);
        }
        .rt {
          display: flex;
          flex-direction: column;
          align-items: flex-end;
          flex: none;
          text-align: right;
        }
        .ovr {
          font-family: var(--font-display);
          font-size: 26px;
          font-weight: 800;
          line-height: 1;
          font-variant-numeric: tabular-nums;
        }
        .ocap {
          font-family: var(--font-mono);
          font-size: 8px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: var(--dim);
          margin-top: 1px;
        }

        .note {
          font-family: var(--font-mono);
          font-size: 8.5px;
          line-height: 1.65;
          color: var(--dim);
          max-width: 60ch;
        }
        .ok {
          color: hsl(150 60% 48%);
        }
        .bad {
          color: hsl(0 72% 58%);
        }
      </style>

      <span class="cap">Current markup — absolute close, pr-14 · 344px</span>
      <div class="sheet">
        <div class="hdr">
          <div class="close">✕</div>
          <div class="row">
            <div class="face">RW</div>
            <div class="nm">
              <p class="name">Russell Westbrook</p>
              <p class="meta">OKC · 2016-17 · 6'3" · 200 lbs</p>
              <div class="badges"><span class="badge">PG/SG</span></div>
            </div>
            <div class="rt">
              <span class="ovr">87</span>
              <span class="ocap">Overall</span>
            </div>
          </div>
        </div>
      </div>

      <p class="note">
        If the X sits over the 87, the reserved space is short. Watch the top-right corner of the
        number above; the ring is the close button's 40px circle starting 12px from the edge.
      </p>
    </div>
  </body>
</html>
