<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hoop Rush — Draft Five</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap");
      :root { color-scheme: dark; --bg:#0c0e13; --surface:#14171d; --line:#292d35; --text:#f4f2ed; --muted:#8c929e; --orange:#ff633b; --gold:#f5b642; --purple:#552583; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
      button,select { font:inherit; }
      button:focus-visible,select:focus-visible { outline:2px solid white; outline-offset:3px; }
      .app { width:min(1080px,100%); margin:auto; padding:0 24px 48px; }
      header { height:68px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
      .brand { font:800 25px/1 "Barlow Condensed"; letter-spacing:-.02em; text-transform:uppercase; }
      .brand span { color:var(--orange); }
      .progress { font:500 11px "Roboto Mono"; color:var(--muted); }
      .intro { display:flex; align-items:end; justify-content:space-between; gap:24px; padding:34px 0 22px; }
      .intro small { color:var(--orange); font:500 10px "Roboto Mono"; letter-spacing:.12em; text-transform:uppercase; }
      h1 { margin:4px 0 0; font:800 clamp(38px,7vw,68px)/.92 "Barlow Condensed"; letter-spacing:-.035em; text-transform:uppercase; }
      .selectors { display:flex; gap:8px; }
      .select-wrap { display:flex; align-items:center; gap:9px; min-width:170px; padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
      .select-wrap img { width:28px; height:28px; object-fit:contain; }
      select { width:100%; border:0; outline:0; color:var(--text); background:transparent; font-weight:600; }
      .layout { display:grid; grid-template-columns:390px minmax(0,1fr); gap:16px; }
      .panel { overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--surface); }
      .panel-title { display:flex; align-items:center; justify-content:space-between; padding:15px 16px; border-bottom:1px solid var(--line); }
      .panel-tools { display:flex; align-items:center; gap:10px; }
      .mode-toggle { border:1px solid #3a3f49; border-radius:999px; padding:6px 9px; color:var(--muted); background:transparent; font:500 9px "Roboto Mono"; cursor:pointer; }
      .mode-toggle[aria-pressed="true"] { border-color:var(--orange); color:white; background:rgba(255,99,59,.12); }
      h2 { margin:0; font:700 19px "Barlow Condensed"; letter-spacing:.02em; text-transform:uppercase; }
      .meta { color:var(--muted); font:500 10px "Roboto Mono"; }
      .player-list { padding:6px; max-height:570px; overflow:auto; }
      .player { width:100%; display:grid; grid-template-columns:52px minmax(0,1fr) auto; align-items:center; gap:12px; padding:9px; border:1px solid transparent; border-radius:10px; color:inherit; background:transparent; text-align:left; cursor:pointer; }
      .player:hover { border-color:var(--line); background:#1a1e25; }
      .player.selected { opacity:.32; pointer-events:none; }
      .face { position:relative; width:52px; height:52px; overflow:hidden; border-radius:8px; background:#20242c; }
      .face img { width:100%; height:100%; object-fit:cover; object-position:top; transform:scale(1.2); transform-origin:top; }
      .fallback { position:absolute; inset:0; display:grid; place-items:center; font:700 18px "Barlow Condensed"; }
      .face img:not([style*="display: none"]) + .fallback { display:none; }
      .name { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; font-weight:700; }
      .year { display:block; margin-top:2px; color:var(--muted); font:500 9px "Roboto Mono"; }
      .line { display:flex; gap:12px; margin-top:6px; color:#c4c8d0; font:500 10px "Roboto Mono"; }
      .line b { color:white; }
      .add { width:29px; height:29px; border:1px solid #3a3f49; border-radius:50%; color:var(--text); background:transparent; font-size:18px; cursor:pointer; }

      .court-panel { display:flex; flex-direction:column; }
      .court-shell { padding:12px; }
      .court { position:relative; min-height:480px; overflow:hidden; border-radius:10px; background:#c98c45; background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 64px); box-shadow:inset 0 0 70px rgba(78,39,6,.28); }
      .court::before { content:""; position:absolute; left:8%; right:8%; top:-2px; height:65%; border:2px solid rgba(255,255,255,.68); border-top:0; }
      .court::after { content:""; position:absolute; left:50%; top:-70px; width:150px; height:225px; transform:translateX(-50%); border:2px solid rgba(255,255,255,.68); border-radius:0 0 85px 85px; }
      .arc { position:absolute; left:17%; top:-42%; width:66%; height:88%; border:2px solid rgba(255,255,255,.68); border-radius:50%; }
      .rim { position:absolute; z-index:2; left:50%; top:73px; width:52px; height:12px; transform:translateX(-50%); border:3px solid #f04d22; border-radius:50%; }
      .slot { position:absolute; z-index:3; width:104px; transform:translate(-50%,-50%); text-align:center; }
      .slot:nth-of-type(1){left:50%;top:77%}.slot:nth-of-type(2){left:22%;top:55%}.slot:nth-of-type(3){left:78%;top:55%}.slot:nth-of-type(4){left:34%;top:29%}.slot:nth-of-type(5){left:66%;top:29%}
      .portrait { position:relative; width:67px; height:67px; margin:auto; overflow:hidden; border:3px solid rgba(255,255,255,.92); border-radius:50%; background:#20242c; box-shadow:0 6px 16px rgba(35,19,5,.3); }
      .portrait img { width:100%; height:100%; object-fit:cover; object-position:top; transform:scale(1.25); transform-origin:top; }
      .empty .portrait { display:grid; place-items:center; border-style:dashed; color:rgba(255,255,255,.75); font:700 18px "Barlow Condensed"; box-shadow:none; }
      .slot-name { display:block; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#241406; font-size:10px; font-weight:800; }
      .remove { position:absolute; right:-2px; top:-2px; width:21px; height:21px; border:0; border-radius:50%; color:white; background:#17191e; cursor:pointer; }
      .court-footer { margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 16px; border-top:1px solid var(--line); }
      .five { font:700 13px "Roboto Mono"; }
      .five span { color:var(--orange); }
      .primary { border:0; border-radius:9px; padding:11px 17px; color:white; background:var(--orange); font-weight:700; cursor:pointer; }
      .primary:disabled { color:#737985; background:#292d34; cursor:not-allowed; }
      .season { display:none; margin-top:16px; padding:17px; }
      .season.show { display:block; }
      .season-head { display:flex; justify-content:space-between; align-items:center; gap:16px; }
      .record { font:800 34px "Barlow Condensed"; }
      .games { display:grid; grid-template-columns:repeat(41,1fr); gap:3px; margin-top:15px; }
      .game { aspect-ratio:.55; border-radius:2px; background:#292d35; }
      .game.win { background:#4c8dff; }.game.loss { background:var(--orange); }
      @media(max-width:780px){
        .app{padding:0 14px 28px}.intro{align-items:stretch;flex-direction:column;padding-top:25px}.selectors{width:100%}.select-wrap{min-width:0;flex:1}.layout{display:flex;flex-direction:column}.court-panel{order:-1}.court{min-height:410px}.player-list{max-height:none}.player-list{display:grid;grid-template-columns:1fr 1fr}.player{grid-template-columns:46px minmax(0,1fr) auto}.face{width:46px;height:46px}.line{gap:7px}.games{grid-template-columns:repeat(21,1fr)}
      }
      @media(max-width:500px){
        .progress{display:none}h1{font-size:43px}.selectors{flex-direction:column}.court{min-height:340px}.court-shell{padding:7px}.portrait{width:55px;height:55px}.slot{width:80px}.slot-name{font-size:9px}.player-list{grid-template-columns:1fr}.season-head{align-items:stretch;flex-direction:column}.season-head .primary{width:100%}
      }
      @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
    </style>
  </head>
  <body>
    <main class="app">
      <header><div class="brand">Hoop <span>Rush</span></div><div class="progress">SANDBOX · 82–0</div></header>
      <section class="intro">
        <div><small>Draft your starting five</small><h1>Can they go 82–0?</h1></div>
        <div class="selectors">
          <label class="select-wrap"><img src="https://cdn.nba.com/logos/nba/1610612747/global/L/logo.svg" alt="" /><select aria-label="Team"><option>Lakers</option><option>Bulls</option><option>Celtics</option></select></label>
          <label class="select-wrap"><select aria-label="Era"><option>1990s</option><option>1980s</option><option>2000s</option></select></label>
        </div>
      </section>
      <section class="layout">
        <div class="panel">
          <div class="panel-title"><h2>Lakers · 1990s</h2><div class="panel-tools"><button class="mode-toggle" id="knowledge" type="button" aria-pressed="false">Ball Knowledge: Off</button><span class="meta">PEAK SEASONS</span></div></div>
          <div class="player-list" id="players"></div>
        </div>
        <div class="panel court-panel">
          <div class="panel-title"><h2>Your five</h2><span class="meta" id="counter">0 OF 5</span></div>
          <div class="court-shell"><div class="court"><span class="arc"></span><span class="rim"></span><div id="slots"></div></div></div>
          <div class="court-footer"><div class="five"><span id="picked">0</span>/5 PICKED</div><button class="primary" id="lock" disabled>Pick five players</button></div>
        </div>
      </section>
      <section class="panel season" id="season">
        <div class="season-head"><div><span class="meta">YOUR 82–0 RUN</span><div class="record" id="record">0–0</div></div><button class="primary" id="sim">Sim next 10</button></div>
        <div class="games" id="games" aria-label="82 game season"></div>
      </section>
    </main>
    <script>
      const players=[
        {id:77142,name:"Magic Johnson",initials:"MJ",nba:"77142",year:"1990–91",ovr:96,off:98,def:82},
        {id:406,name:"Shaquille O'Neal",initials:"SO",nba:"406",year:"1999–00",ovr:98,off:99,def:94},
        {id:977,name:"Kobe Bryant",initials:"KB",nba:"977",year:"1999–00",ovr:91,off:92,def:91},
        {id:224,name:"Eddie Jones",initials:"EJ",nba:"224",year:"1997–98",ovr:86,off:84,def:90},
        {id:124,name:"Vlade Divac",initials:"VD",nba:"124",year:"1994–95",ovr:84,off:83,def:85},
        {id:600,name:"Nick Van Exel",initials:"NV",nba:"600",year:"1996–97",ovr:85,off:91,def:66},
        {id:185,name:"Cedric Ceballos",initials:"CC",nba:"185",year:"1994–95",ovr:82,off:86,def:70},
        {id:920,name:"A.C. Green",initials:"AG",nba:"920",year:"1993–94",ovr:81,off:74,def:84}
      ];
      const selected=[];let played=0,wins=0,losses=0,ballKnowledge=false;
      const url=p=>`https://cdn.nba.com/headshots/nba/latest/1040x760/${p.nba}.png`;
      const image=p=>`<div class="face"><img src="${url(p)}" alt="${p.name}" onerror="this.style.display='none'"/><span class="fallback">${p.initials}</span></div>`;
      function drawPlayers(){const list=ballKnowledge?[...players].sort((a,b)=>a.name.localeCompare(b.name)):players;document.querySelector("#players").innerHTML=list.map(p=>`<button class="player ${selected.includes(p.id)?"selected":""}" data-id="${p.id}">${image(p)}<span><span class="name">${p.name}</span>${ballKnowledge?"":`<span class="year">${p.year}</span><span class="line"><span><b>${p.ovr}</b> OVR</span><span><b>${p.off}</b> OFF</span><span><b>${p.def}</b> DEF</span></span>`}</span><span class="add">+</span></button>`).join("")}
      function drawFive(){document.querySelector("#slots").innerHTML=Array.from({length:5},(_,i)=>{const p=players.find(x=>x.id===selected[i]);return `<div class="slot ${p?"":"empty"}">${p?`<div class="portrait"><img src="${url(p)}" alt="${p.name}" onerror="this.style.display='none'"/><button class="remove" data-i="${i}" aria-label="Remove ${p.name}">×</button></div><span class="slot-name">${p.name}</span>`:`<div class="portrait">${i+1}</div><span class="slot-name">Open</span>`}</div>`}).join("");document.querySelector("#counter").textContent=`${selected.length} OF 5`;document.querySelector("#picked").textContent=selected.length;const lock=document.querySelector("#lock");lock.disabled=selected.length!==5;lock.textContent=selected.length===5?"Start challenge":`Pick ${5-selected.length} more`;drawPlayers()}
      document.querySelector("#players").addEventListener("click",e=>{const b=e.target.closest(".player");if(b&&selected.length<5){selected.push(Number(b.dataset.id));drawFive()}});
      document.querySelector("#knowledge").addEventListener("click",e=>{ballKnowledge=!ballKnowledge;e.currentTarget.setAttribute("aria-pressed",String(ballKnowledge));e.currentTarget.textContent=`Ball Knowledge: ${ballKnowledge?"On":"Off"}`;drawPlayers()});
      document.querySelector("#slots").addEventListener("click",e=>{const b=e.target.closest(".remove");if(b){selected.splice(Number(b.dataset.i),1);drawFive()}});
      document.querySelector("#lock").addEventListener("click",()=>{document.querySelector("#season").classList.add("show");document.querySelector("#season").scrollIntoView({behavior:"smooth"})});
      document.querySelector("#games").innerHTML=Array.from({length:82},(_,i)=>`<span class="game" title="Game ${i+1}"></span>`).join("");
      document.querySelector("#sim").addEventListener("click",()=>{const games=[...document.querySelectorAll(".game")];for(let i=0;i<10&&played<82;i++,played++){const win=((played*37+17)%23)>3;games[played].classList.add(win?"win":"loss");win?wins++:losses++}document.querySelector("#record").textContent=`${wins}–${losses}`});
      drawPlayers();drawFive();
    </script>
  </body>
</html>
