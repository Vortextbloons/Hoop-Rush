<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta
      name="description"
      content="Hoop Rush — build a five-player lineup from a real NBA franchise and decade, then chase 82-0."
    />
    <link rel="icon" href="%sveltekit.assets%/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="%sveltekit.assets%/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var nav = navigator;
          var manual = null;
          try {
            manual = localStorage.getItem('hoop-rush:lite-mode');
          } catch (e) {}
          var lite;
          if (manual === 'on') {
            lite = true;
          } else if (manual === 'off') {
            lite = false;
          } else {
            var conn = nav.connection || nav.mozConnection || nav.webkitConnection || {};
            var hw = nav.hardwareConcurrency || 0;
            var mem = nav.deviceMemory || 0;
            var reduced =
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            lite = conn.saveData === true || (mem > 0 && mem < 4) || (hw > 0 && hw <= 4) || reduced;
          }
          if (lite) document.documentElement.setAttribute('data-lite', '');
        } catch (e) {}
        var path = location.pathname.replace(/\/+$/, '');
        if (/\/multiplayer$/.test(path)) return;
        if (document.documentElement.hasAttribute('data-lite')) return;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.href = '%sveltekit.assets%/data/manifest.json';
        link.as = 'fetch';
        link.fetchPriority = 'low';
        document.head.appendChild(link);
      })();
    </script>
    <link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
