<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Hoop Rush — build a five-player lineup from a real NBA franchise and decade, then chase 82-0."
    />
    <link rel="icon" href="%sveltekit.assets%/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="%sveltekit.assets%/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <!-- Preload the packaged data manifest: the first fetch() on any route
         reuses this request instead of issuing a second download. The
         crossorigin attribute makes the preload a CORS-enabled request, so
         the app's own fetch() can reuse the cached response. -->
    <link rel="preload" href="%sveltekit.assets%/data/manifest.json" as="fetch" crossorigin />
    <link rel="preload" href="%sveltekit.assets%/fonts/fonts.css" as="style" />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/barlow-condensed-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/barlow-condensed-800-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
