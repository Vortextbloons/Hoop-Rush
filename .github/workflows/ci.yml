name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-repo

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Quick unit and integration tests
        run: pnpm test:quick

  # The full suite (block determinism, property tests, CLI integration)
  # runs on push to main and nightly; per-commit gates stay fast.
  tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-repo

      - name: Full unit and integration tests
        run: pnpm test:run

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            **/test-results/
          if-no-files-found: ignore
          retention-days: 7

  data:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-repo

      - name: Validate packaged data
        run: pnpm hoop-rush data validate

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-repo

      - name: Production build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm build

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/build
          if-no-files-found: error
          retention-days: 7

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quick, build]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-repo

      - name: Download static build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/build

      - name: Run Playwright smoke tests
        uses: ./.github/actions/playwright-e2e
        with:
          command: pnpm e2e:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
