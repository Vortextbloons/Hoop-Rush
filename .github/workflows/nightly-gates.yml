name: Nightly calibration and engine gates

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - 'packages/engine/**'
      - 'packages/data-contracts/**'
      - 'packages/importer/**'
      - 'tools/cli/**'
      - 'apps/web/static/data/**'

permissions:
  contents: read

concurrency:
  group: nightly-gates
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Full test suite (including golden regeneration)
        run: pnpm test:run

      - name: Validate packaged data
        run: pnpm hoop-rush data validate

      - name: Release calibration (2,000-sample gates)
        run: pnpm hoop-rush calibrate run --format json

      - name: Sensitivity suite
        run: pnpm hoop-rush calibrate sensitivity --format json

      - name: Bracket audit
        run: pnpm hoop-rush bracket audit

      - name: Benchmark
        run: pnpm hoop-rush benchmark --format json

      - name: Production build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm build
