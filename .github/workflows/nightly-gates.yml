name: Nightly calibration and engine gates

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - 'packages/engine/**'
      - 'packages/data-contracts/**'
      - 'packages/importer/**'
      - 'tools/cli/**'
      - 'apps/web/static/data/**'

permissions:
  contents: read

concurrency:
  group: nightly-gates
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      # ci.yml already runs the full suite on the same push; this step is the
      # nightly-only full run (golden regeneration included).
      - name: Full test suite (including golden regeneration)
        if: github.event_name == 'schedule'
        run: pnpm test:run

      # The M2.5 integration-run calibration suites are skipped by default
      # (they freeze the packaged targets artifacts); the nightly forces them
      # so they run exactly once per day.
      - name: M2.5 integration-run calibration (forced)
        env:
          HOOP_RUSH_INTEGRATION_RUNS: '1'
        run: pnpm --filter @hoop-rush/cli test:run src/cli-season-m25-calibrate.test.ts

      - name: Validate packaged data
        run: pnpm hoop-rush data validate

      - name: Release calibration (2,000-sample gates)
        run: pnpm hoop-rush calibrate run --format json

      - name: Sensitivity suite
        run: pnpm hoop-rush calibrate sensitivity --format json

      - name: Bracket audit
        run: pnpm hoop-rush bracket audit

      - name: Benchmark
        run: pnpm hoop-rush benchmark --format json

      - name: Production build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm build

  # The full Playwright suite (including the real-worker block journeys that
  # take minutes) runs only at night; PR CI keeps the @smoke subset fast.
  e2e-full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter @hoop-rush/web exec playwright install --with-deps chromium

      - name: Build static site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm build

      - name: Run full Playwright suite
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
